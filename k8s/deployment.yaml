apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo_service
  namespace: demo
  labels:
    app: demo_service
    app.kubernetes.io/managed-by: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo_service
  template:
    metadata:
      labels:
        app: demo_service
    spec:
      containers:
        - name: demo_service
          image: nginx:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
